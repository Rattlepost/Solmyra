<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work in Progress</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wiki-article-page wip-page">
  <div class="wip-diamond"></div>
  <p class="wip-label">Work in Progress</p>

</div>

<style>
  .wip-page {
    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 14px;
  }
  .wip-diamond {
    width: 30px;
    height: 30px;
    background: #2a2f3e;
    transform: rotate(45deg);
    margin-bottom: 6px;
  }
  .wip-label {
    font-size: 40px;
    letter-spacing: 0.25em;

    color: #4a5568;
    margin: 0;
  }
  .wip-sub {

    color: #2a2f3e;
    letter-spacing: 0.08em;
    margin: 0;
