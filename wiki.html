<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solmyra — Wiki</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="images/favicon.ico" type="image/ico" />

<body>

  <a href="index.html" class="wiki-nav-btn">← World Map</a>

  <div id="m-lock-overlay">
    <div class="m-lock-diamond"></div>
    <p>Restricted</p>
    <input id="m-lock-input" type="password" placeholder="Enter password" autocomplete="off" />
    <p id="m-lock-err"></p>
  </div>

  <div class="wiki-page">
    <aside class="wiki-contents">
      <div class="wiki-contents-header">
        <div class="wiki-contents-eyebrow">— Solmyra —</div>
        <div class="wiki-contents-title">Compendium</div>
      </div>

      <div class="wiki-search">
        <div class="wiki-search-box" id="wiki-search-box">
          <svg class="wiki-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input id="wiki-search-input" type="text" placeholder="Search compendium…" autocomplete="off" />
          <button class="wiki-search-clear" id="wiki-search-clear" type="button" aria-label="Clear search">&times;</button>
        </div>
      </div>

      <div class="wiki-search-results" id="wiki-search-results"></div>

      <nav class="wiki-contents-nav" id="wiki-contents-nav">

        <details class="wiki-nav-details" open>
          <summary>Landmasses</summary>

          <details class="wiki-nav-details">
            <summary>Solmarch</summary>

            <!-- Grennmoor — clickable + expandable ---------------------------------------------------->
            <div class="wiki-nav-expandable">
              <button class="wiki-nav-link" data-src="wiki/regions/solmarch/grennmoor/grennmoor.html">Grennmoor</button>
              <button class="wiki-nav-expand-btn" onclick="this.parentElement.classList.toggle('open')">▸</button>
            </div>
            <div class="wiki-nav-expandable-children">
              <!-- Towns dropdown under Grennmoor -->
              <details class="wiki-nav-details">
                <summary>Towns</summary>
                <button class="wiki-nav-link" data-src="wiki/regions/solmarch/grennmoor/towns/duskhelm.html">Duskhelm</button>
                <button class="wiki-nav-link" data-src="wiki/regions/solmarch/grennmoor/towns/stillhaven.html">Stillhaven</button>
                <button class="wiki-nav-link" data-src="wiki/regions/solmarch/grennmoor/towns/greyport.html">Greyport</button>
                <button class="wiki-nav-link" data-src="wiki/regions/solmarch/grennmoor/towns/fenwick.html">Fenwick</button>
                <button class="wiki-nav-link" data-src="wiki/wip.html">Fort Perrol</button>
                <button class="wiki-nav-link" data-src="wiki/regions/solmarch/grennmoor/towns/dredgeholm.html">Dredgeholm</button>
                <button class="wiki-nav-link" data-src="wiki/wip.html">Valdrest</button>
                <button class="wiki-nav-link" data-src="wiki/wip.html">Lone Landing</button>
                <button class="wiki-nav-link" data-src="wiki/wip.html">Gateside</button>
                <button class="wiki-nav-link" data-src="wiki/wip.html">Greyport</button>
                <button class="wiki-nav-link" data-src="wiki/wip.html">Aldshore</button>
                <button class="wiki-nav-link" data-src="wiki/wip.html">Coldshore</button>
                <button class="wiki-nav-link" data-src="wiki/wip.html">Glassend</button>
                <button class="wiki-nav-link" data-src="wiki/wip.html">Lethwick</button>
              </details>
              <details class="wiki-nav-details">
                <summary>Points of Interest</summary>
                <button class="wiki-nav-link" data-src="wiki/regions/solmarch/grennmoor/pois/dredgeholm_mine.html">Dredgeholm Mines</button>
                <button class="wiki-nav-link" data-src="wiki/wip.html">Midwood Forest</button>
                <button class="wiki-nav-link" data-src="wiki/regions/solmarch/grennmoor/pois/stillwood_grove.html">Stillwood Grove</button>
              </details>
              <details class="wiki-nav-details">
                <summary>Noteable Events</summary>
                <button class="wiki-nav-link" data-src="wiki/regions/solmarch/grennmoor/events/grennmoor_rebellion.html">Grennmoor Rebellion</button>
                <button class="wiki-nav-link" data-src="wiki/regions/solmarch/grennmoor/events/pellhiem_uprising.html">Pellhiem Uprising</button>
              </details>
              <details class="wiki-nav-details">
                <summary>Culture</summary>
                <button class="wiki-nav-link" data-src="wiki/wip.html">Nothing Here Yet</button>
              </details>
              <!-- Add more dropdowns or links under Grennmoor here -->
            </div>


            <!-- Pellhiem ------------------------------------------------------------------------------------>
            <div class="wiki-nav-expandable">
              <button class="wiki-nav-link" data-src="wiki/regions/solmarch/pellhiem/pellhiem.html">Pellhiem</button>
              <button class="wiki-nav-expand-btn" onclick="this.parentElement.classList.toggle('open')">▸</button>
            </div>
            <div class="wiki-nav-expandable-children">
              <details class="wiki-nav-details">
                <summary>Towns</summary>
               <button class="wiki-nav-link" data-src="wiki/wip.html">Nothing Here Yet</button>
              </details>
              <details class="wiki-nav-details">
                <summary>Points of Interest</summary>
                <button class="wiki-nav-link" data-src="wiki/regions/solmarch/pellhiem/pois/fort_eldwick.html">Fort Eldwick</button>
              </details>
              <details class="wiki-nav-details">
                <summary>Noteable Events</summary>
                <button class="wiki-nav-link" data-src="wiki/regions/solmarch/pellhiem/events/capture_fort_eldwick.html">Capture of Fort Eldwick</button>
              </details>
              <details class="wiki-nav-details">
                <summary>Culture</summary>
                <button class="wiki-nav-link" data-src="wiki/wip.html">Nothing Here Yet</button>
              </details>
            </div>

          </details>

          <details class="wiki-nav-details">
            <summary>The Far Lands</summary>
            <button class="wiki-nav-link" data-src="wiki/regions/far_lands/far_lands.html">The Far Lands</button>
            <button class="wiki-nav-link" data-restricted="true" data-key="far_lands" data-src="wiki/regions/far_lands/far_lands_expanded.html">Far Lands Expanded</button>
          </details>
          <!-- Add more regions here -->

        </details>

        <details class="wiki-nav-details">
          <summary>History</summary>
          <button class="wiki-nav-link" data-restricted="true" data-key="founding" data-src="wiki/history/the_founding.html">The Founding</button>
        </details>
        
        <details class="wiki-nav-details">
          <summary>Pantheon</summary>
          <button class="wiki-nav-link" data-src="wiki/pantheon/pantheon_of_solmyra.html">The Pantheon of Solmyra</button>
          <button class="wiki-nav-link" data-restricted="true" data-key="pantheon" data-src="wiki/pantheon/pantheon_expanded.html">Pantheon Expanded</button>

        </details>

      </nav>
    </aside>

    <main class="wiki-panel" id="wiki-panel">
      <div class="wiki-panel-empty" id="wiki-empty">
        <div class="wiki-panel-empty-diamond"></div>
        <p>Select an article</p>
      </div>
      <iframe class="wiki-iframe" id="wiki-iframe" title="Article"></iframe>
      <div id="m-article-content"></div>
    </main>
  </div>

  <script src="passwords.js"></script>
  <script>
    const iframe      = document.getElementById("wiki-iframe");
    const empty       = document.getElementById("wiki-empty");
    const panel       = document.getElementById("wiki-panel");
    const contents    = document.querySelector(".wiki-contents");
    const mContent    = document.getElementById("m-article-content");
    const buttons     = document.querySelectorAll(".wiki-nav-link");
    const lockOverlay = document.getElementById("m-lock-overlay");
    const lockInput   = document.getElementById("m-lock-input");
    const lockErr     = document.getElementById("m-lock-err");
    const isMobile    = () => window.innerWidth <= 768;

    const backBtn = document.createElement("button");
    backBtn.className = "m-back-btn";
    backBtn.textContent = "← Back";
    panel.insertBefore(backBtn, panel.firstChild);

    backBtn.addEventListener("click", () => {
      contents.classList.remove("m-hidden");
      panel.classList.remove("m-visible");
      lockOverlay.classList.remove("show");
      mContent.innerHTML = "";
    });

    function showLock(password, key) {
      lockOverlay.classList.add("show");
      lockInput.value = "";
      lockErr.textContent = "";
      lockInput.style.borderColor = "#2e2416";
      lockInput.focus();
      const newInput = lockInput.cloneNode(true);
      lockInput.parentNode.replaceChild(newInput, lockInput);
      newInput.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        if (newInput.value === password) {
          sessionStorage.setItem(key, "yes");
          lockOverlay.classList.remove("show");
        } else {
          lockErr.textContent = "Incorrect";
          newInput.value = "";
          newInput.style.borderColor = "#5a2e22";
          setTimeout(() => {
            newInput.style.borderColor = "#2e2416";
            lockErr.textContent = "";
          }, 1000);
        }
      });
    }

    // ------------------------------------------------------------
    // Sidebar search
    // ------------------------------------------------------------
    const searchInput   = document.getElementById("wiki-search-input");
    const searchBox     = document.getElementById("wiki-search-box");
    const searchClear   = document.getElementById("wiki-search-clear");
    const searchResults = document.getElementById("wiki-search-results");
    const navEl         = document.getElementById("wiki-contents-nav");

    function closeSearch() {
      searchInput.value = "";
      searchBox.classList.remove("has-value");
      navEl.style.display = "";
      searchResults.style.display = "none";
    }

    searchClear.addEventListener("click", () => {
      closeSearch();
      searchInput.focus();
    });

    // Pull the section a button lives under (e.g. "Towns", "Points of Interest")
    // by walking up to the nearest <details><summary> ancestor.
    function getSection(btn) {
      let el = btn.parentElement;
      while (el && el !== document.body) {
        if (el.tagName === "DETAILS") {
          const summary = el.querySelector(":scope > summary");
          if (summary) return summary.textContent.trim();
        }
        el = el.parentElement;
      }
      return "";
    }

    const searchIndex = Array.from(buttons).map((btn) => ({
      el: btn,
      title: btn.textContent.trim(),
      section: getSection(btn),
      restricted: btn.dataset.restricted === "true",
    }));

    function scoreMatch(title, query) {
      const t = title.toLowerCase();
      const q = query.toLowerCase();
      if (t === q) return 100;
      if (t.startsWith(q)) return 80;
      const words = t.split(/\s+/);
      if (words.some((w) => w.startsWith(q))) return 60;
      if (t.includes(q)) return 40;
      return 0;
    }

    function renderSearchResults(query) {
      const matches = searchIndex
        .map((item) => ({ ...item, score: scoreMatch(item.title, query) }))
        .filter((item) => item.score > 0)
        .sort((a, b) => b.score - a.score || a.title.localeCompare(b.title));

      searchResults.innerHTML = "";

      const count = document.createElement("div");
      count.className = "wiki-search-results-count";
      count.textContent = matches.length
        ? `${matches.length} result${matches.length === 1 ? "" : "s"}`
        : "";
      searchResults.appendChild(count);

      if (matches.length === 0) {
        const empty = document.createElement("p");
        empty.className = "wiki-search-empty";
        empty.textContent = "No matches found";
        searchResults.appendChild(empty);
        return;
      }

      matches.forEach((item) => {
        const btn = document.createElement("button");
        btn.className = "wiki-nav-link wiki-search-result";

        const label = document.createElement("span");
        label.textContent = item.restricted ? `${item.title} 🔒` : item.title;
        btn.appendChild(label);

        if (item.section) {
          const meta = document.createElement("span");
          meta.className = "wiki-search-result-meta";
          meta.textContent = item.section;
          btn.appendChild(meta);
        }

        btn.addEventListener("click", () => {
          item.el.click();
          closeSearch();
        });

        searchResults.appendChild(btn);
      });
    }

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim();
      searchBox.classList.toggle("has-value", q.length > 0);
      if (q.length === 0) {
        navEl.style.display = "";
        searchResults.style.display = "none";
        return;
      }
      navEl.style.display = "none";
      searchResults.style.display = "flex";
      renderSearchResults(q);
    });

    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeSearch();
        searchInput.blur();
      }
    });

    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        buttons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
              window._lastClickedBtn = btn;

        if (isMobile()) {
          fetch(btn.dataset.src)
            .then((r) => r.text())
            .then((html) => {
              const parser  = new DOMParser();
              const doc     = parser.parseFromString(html, "text/html");
              const content = doc.querySelector(".wiki-article-page");

              if (content) {
                content.querySelectorAll("article-text").forEach((block) => {
                  const raw = block.innerHTML;
                  const paras = raw.split(/\n\s*\n/)
                    .map((p) => p.trim())
                    .filter((p) => p.length > 0)
                    .map((p) => `<p>${p.replace(/\n/g, " ")}</p>`)
                    .join("");
                  const div = document.createElement("div");
                  div.innerHTML = paras;
                  block.replaceWith(div);
                });

                mContent.innerHTML = "";
                mContent.appendChild(content);

                const locked   = content.dataset.locked === "true";
                const key      = content.dataset.key;
                const password = PASSWORDS[key];

                if (locked && key && password && sessionStorage.getItem(key) !== "yes") {
                  showLock(password, key);
                }
              } else {
                mContent.innerHTML = '<p style="color:#5c5340;padding:24px;">Could not load article.</p>';
              }

              contents.classList.add("m-hidden");
              panel.classList.add("m-visible");
              panel.scrollTop = 0;
            })
            .catch(() => {
              mContent.innerHTML = '<p style="color:#5c5340;padding:24px;">Could not load article.</p>';
            });
        } else {
          iframe.src = btn.dataset.src;
          iframe.classList.add("show");
          empty.style.display = "none";
        }
      });
    });
    // Open article from URL parameter (e.g. wiki.html?article=wiki/regions/...)
const urlParams = new URLSearchParams(location.search);
const articleParam = urlParams.get('article');
if (articleParam) {
  iframe.src = articleParam;
  iframe.classList.add('show');
  empty.style.display = 'none';
  const decoded = decodeURIComponent(articleParam);
  if (decoded !== 'wiki/wip.html') {
    buttons.forEach(btn => {
      if (btn.dataset.src === decoded) {
        btn.classList.add('active');
        let el = btn.parentElement;
        while (el && el !== document.body) {
          if (el.tagName === 'DETAILS') el.open = true;
          if (el.classList.contains('wiki-nav-expandable-children')) {
            el.previousElementSibling.classList.add('open');
          }
          el = el.parentElement;
        }
      }
    });
  }
}

  // Update sidebar when iframe navigates (related links etc.)
  document.getElementById('wiki-iframe').addEventListener('load', () => {
    try {
      const iframePath = document.getElementById('wiki-iframe').contentWindow.location.pathname;
      const src = iframePath.includes('/Solmyra/')
        ? iframePath.split('/Solmyra/')[1]
        : iframePath.replace(/^[/]/, '');
      document.querySelectorAll('.wiki-nav-link').forEach(btn => {
        btn.classList.remove('active');
        const isWip = src === 'wiki/wip.html';
        const matches = btn.dataset.src === src && (!isWip || btn === window._lastClickedBtn);
        if (matches) {
          btn.classList.add('active');
          if (!isWip) {
            let el = btn.parentElement;
            while (el && el !== document.body) {
              if (el.tagName === 'DETAILS') el.open = true;
              if (el.classList.contains('wiki-nav-expandable-children')) {
                el.previousElementSibling.classList.add('open');
              }
              el = el.parentElement;
            }
            btn.scrollIntoView({ block: 'center', behavior: 'smooth' });
          }
        }
      });
    } catch(e) {}
  });
  </script>
</body>
</html>
