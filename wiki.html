<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solmyra — Wiki</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="images/favicon.ico" type="image/ico">
</head>
<body>

  <a href="index.html" class="wiki-nav-btn">← World Map</a>

  <div class="wiki-page">

    <aside class="wiki-contents">
      <div class="wiki-contents-header">
        <div class="wiki-contents-eyebrow">— Solmyra —</div>
        <div class="wiki-contents-title">Compendium</div>
      </div>

      <nav class="wiki-contents-nav">

        <details class="wiki-nav-details" open>
          <summary>Regions</summary>

          <details class="wiki-nav-details">
            <summary>Solmarch</summary>
            <button class="wiki-nav-link" data-src="wiki/regions/test_password.html">Test Password</button>
            <button class="wiki-nav-link" data-src="wiki/regions/grennmoor.html">Grennmoor</button>
          </details>

        </details>

        <details class="wiki-nav-details">
          <summary>History</summary>
          <button class="wiki-nav-link" data-src="wiki/history/the-founding.html">The Founding Age</button>
        </details>

      </nav>
    </aside>

    <main class="wiki-panel" id="wiki-panel">
      <div class="wiki-panel-empty" id="wiki-empty">
        <div class="wiki-panel-empty-diamond"></div>
        <p>Select an article</p>
      </div>
      <iframe class="wiki-iframe" id="wiki-iframe" title="Article"></iframe>
      <div id="m-article-content"></div>
    </main>

  </div>

  <script>
  const iframe   = document.getElementById('wiki-iframe');
  const empty    = document.getElementById('wiki-empty');
  const panel    = document.getElementById('wiki-panel');
  const contents = document.querySelector('.wiki-contents');
  const mContent = document.getElementById('m-article-content');
  const buttons  = document.querySelectorAll('.wiki-nav-link');
  const isMobile = () => window.innerWidth <= 768;

  const backBtn = document.createElement('button');
  backBtn.className = 'm-back-btn';
  backBtn.textContent = '← Back';
  panel.insertBefore(backBtn, panel.firstChild);

  backBtn.addEventListener('click', () => {
    contents.classList.remove('m-hidden');
    panel.classList.remove('m-visible');
    mContent.innerHTML = '';
  });

  function applyLock(content) {
    const page     = content.querySelector('[data-locked]');
    const lockEl   = content.querySelector('#lock-screen');
    const input    = content.querySelector('#pw');
    const err      = content.querySelector('#pw-err');
    if (!page || !lockEl || !input) return;

    const locked   = page.dataset.locked === 'true';
    const password = page.dataset.password;
    const key      = page.dataset.key;

    if (locked && key && sessionStorage.getItem(key) !== 'yes') {
      lockEl.style.display = 'flex';
      page.style.display = 'none';
      input.focus();
      input.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        if (input.value === password) {
          sessionStorage.setItem(key, 'yes');
          lockEl.style.display = 'none';
          page.style.display = '';
        } else {
          if (err) err.textContent = 'Incorrect';
          input.value = '';
          input.style.borderColor = '#4a3040';
          setTimeout(() => {
            input.style.borderColor = '#2a2f3e';
            if (err) err.textContent = '';
          }, 1000);
        }
      });
    }
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (isMobile()) {
        fetch(btn.dataset.src)
          .then(r => r.text())
          .then(html => {
            const parser = new DOMParser();
            const doc    = parser.parseFromString(html, 'text/html');

            // Grab article page and lock screen
            const content    = doc.querySelector('.wiki-article-page');
            const lockScreen = doc.querySelector('#lock-screen');

            // Build a wrapper with both lock screen and content
            const wrapper = document.createElement('div');
            if (lockScreen) wrapper.appendChild(lockScreen);
            if (content) {
              // Auto-paragraph
              content.querySelectorAll('article-text').forEach(block => {
                const raw = block.innerHTML;
                const paras = raw.split(/\n\s*\n/)
                  .map(p => p.trim())
                  .filter(p => p.length > 0)
                  .map(p => `<p>${p.replace(/\n/g, ' ')}</p>`)
                  .join('');
                const div = document.createElement('div');
                div.innerHTML = paras;
                block.replaceWith(div);
              });
              wrapper.appendChild(content);
            } else {
              wrapper.innerHTML = '<p style="color:#4a5568;padding:24px;">Could not load article.</p>';
            }

            mContent.innerHTML = '';
            mContent.appendChild(wrapper);

            // Apply lock logic
            applyLock(wrapper);

            contents.classList.add('m-hidden');
            panel.classList.add('m-visible');
            panel.scrollTop = 0;
          })
          .catch(() => {
            mContent.innerHTML = '<p style="color:#4a5568;padding:24px;">Could not load article.</p>';
          });

      } else {
        iframe.src = btn.dataset.src;
        iframe.classList.add('show');
        empty.style.display = 'none';
      }
    });
  });
  </script>

</body>
</html>
